# Multivariate (multi-channel) TSMixer forecasting on the Italy EMF datasets.
# Hyperparameters are copied verbatim from rf_emf/tsmixer/args.yaml; only the
# multivariate switches differ (univariate=False, dataset_class=forecasting,
# conf.conf=True, eval_test_per_epoch=True). data.dataset / seq_len / pred_len /
# exp.id are set per run by .personal/scripts/multivariate/conformal-prediction-grid.sh, and
# data.num_channels is auto-inferred from the CSV at load time (27 or 29).
# TSMixer mixes across channels natively, so this forecasts all bands jointly.
exp:
  project_name: "rf-emf-forecasting/RF-EMF-MV"
  model_id: "TSMixer"
  learning_type: "sl"
  id: "mv_ed2022_L192_O96_cp"
  seed_list: [69421, 69422]
  seed: 69421
  mae: True
  task: "forecasting"
  gpu_id: 2
  neptune: False
  mps: True
  eval_test_per_epoch: True

data:
  seq_load: True
  dataset: "ED2022"
  univariate: False
  window_stride: 1
  dtype: "float32"
  seq_len: 192
  pred_len: 96
  train_split: 0.7
  val_split: 0.1
  num_channels: 27
  num_workers: 4
  scale: True

ddp:
  ddp: False
  master_port: "11759"
  find_unused_parameters: True

sl:
  optimizer: "adam"
  dataset_class: "forecasting"
  criterion: "MSE"
  scheduler: "onecycle"
  d_model: 32
  num_enc_layers: 1
  dropout: 0.3
  epochs: 100
  batch_size: 512
  lr: 1e-4
  early_stopping: True
  weight_decay: 1e-4
  revin: True
  revin_affine: True
  revout: True

scheduler:
  pct_start: 0.3
  lradj: "type3"

early_stopping:
  patience: 20

conf:
  conf: True
  alpha: 0.1
  corrected: False
  intervals: True
  validation_eval: False
