# Multivariate (multi-channel) EMForecaster forecasting on the Italy EMF datasets.
# Hyperparameters are copied verbatim from rf_emf/emforecaster/args.yaml; only the
# multivariate switches differ (univariate=False, dataset_class=forecasting,
# eval_test_per_epoch=False; conf.conf was already True). data.dataset / seq_len /
# pred_len / exp.id are set per run by .personal/scripts/multivariate/conformal-prediction-grid.sh, and
# data.num_channels is auto-inferred from the CSV at load time (27 or 29).
# EMForecaster is multivariate via channel independence: it folds the channels
# into the batch, forecasts them jointly in one pass, and returns (B, C, O).
# Note: the effective batch through the patch backbone is batch_size * num_channels
# (512 * 27/29); lower sl.batch_size if memory is tight.
exp:
  project_name: "rf-emf-forecasting/RF-EMF-MV"
  model_id: "EMForecaster"
  patch_model_id: "TSMixer"
  backbone_id: "Linear"
  learning_type: "sl"
  id: "mv_emf2023_L336_O96_cp"
  seed_list: [69421, 69422]
  seed: 69421
  mae: True
  rank_verbose: False
  task: "forecasting"
  neptune: False
  mps: False  # CUDA box (RTX 5070); MPS is Apple-only and would fall back to CPU
  tf32: True  # TF32 matmul kernels: big speedup on Blackwell, slight fp32 precision trade
  amp: True  # bfloat16 autocast for TRAINING only (eval stays fp32 for exact reported metrics)
  gpu_id: 0
  eval_test_per_epoch: False  # perf(2026-07-06): diagnostic-only test eval; no effect on metrics

data:
  patch_dim: 8
  patch_stride: -1
  seq_load: True
  dataset: "EMF_2023_university_5_with_PTV"
  univariate: False
  window_stride: 1
  dtype: "float32"
  seq_len: 336
  pred_len: 96
  train_split: 0.7
  val_split: 0.1
  num_channels: 27
  num_workers: 0  # perf: in-RAM tensor dataset; on Windows, DataLoader workers spawn+copy the whole tensor, so 0 is fastest
  pin_memory: True  # perf: pins host batches for faster async host->device copy to the CUDA GPU
  scale: True

tsmixer:
  dropout: 0.3
  num_enc_layers: 2
  d_model: 256

dlinear:
  moving_avg: 3
  individual: False
  final_moving_avg: 25

ddp:
  ddp: False
  master_port: "11759"
  find_unused_parameters: True

sl:
  optimizer: "adam"
  pos_enc: "none"
  dataset_class: "forecasting"
  criterion: "MSE"
  scheduler: "onecycle"
  dropout: 0.3
  epochs: 100
  batch_size: 1536  # perf(2026-07-07): 512->1536 to use more of the 12GB GPU (was ~2.6GB/22% at 512); raised while DLinear+PatchTST run at 512, safe because grid set_window never rewrites batch_size. Lower if CUDA OOMs.
  lr: 1e-4
  early_stopping: True
  weight_decay: 1e-5
  return_head: True

  # RevIN
  revin: True
  revin_affine: True
  revout: True
  eps_revin: 1e-5

  # EMForecaster
  patch_norm: "none"
  patch_act: "gelu"
  patch_embed_dim: 256
  independent_patching: False

scheduler:
  pct_start: 0.3
  lradj: "type3"

early_stopping:
  patience: 20

conf:
  conf: True
  alpha: 0.1
  corrected: False
  intervals: True
  validation_eval: False
