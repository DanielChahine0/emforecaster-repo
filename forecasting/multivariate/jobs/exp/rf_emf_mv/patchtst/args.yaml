# Multivariate (multi-channel) PatchTST forecasting on the Italy EMF datasets.
# Hyperparameters are copied verbatim from rf_emf/patchtst/args.yaml; only the
# multivariate switches differ (univariate=False, dataset_class=forecasting,
# conf.conf=True, eval_test_per_epoch=False). data.dataset / seq_len / pred_len /
# exp.id are set per run by .personal/scripts/multivariate/conformal-prediction-grid.sh, and
# data.num_channels is auto-inferred from the CSV at load time (27 or 29).
exp:
  project_name: "rf-emf-forecasting/RF-EMF-MV"
  model_id: "PatchTST"
  learning_type: "sl"
  id: "mv_emf2023_L336_O96_cp"
  seed_list: [69421, 69422]
  seed: 69421
  mae: True
  rank_verbose: False
  task: "forecasting"
  gpu_id: 0
  neptune: False
  mps: False  # CUDA box (RTX 5070); MPS is Apple-only and would fall back to CPU
  tf32: True  # TF32 matmul kernels: big speedup on Blackwell, slight fp32 precision trade
  amp: True  # bfloat16 autocast for TRAINING only (eval stays fp32 for exact reported metrics)
  eval_test_per_epoch: False  # perf(2026-07-06): diagnostic-only test eval; no effect on metrics

data:
  seq_load: True
  dataset: "EMF_2023_university_5_with_PTV"
  univariate: False
  window_stride: 1
  dtype: "float32"
  seq_len: 336
  pred_len: 96
  train_split: 0.7
  val_split: 0.1
  num_channels: 27
  num_workers: 0  # perf: in-RAM tensor dataset; on Windows, DataLoader workers spawn+copy the whole tensor, so 0 is fastest
  pin_memory: True  # perf: pins host batches for faster async host->device copy to the CUDA GPU
  scale: True
  patch_dim: 16
  patch_stride: 8

ddp:
  ddp: False
  master_port: "12356"

sl:
  optimizer: "adam"
  dataset_class: "forecasting"
  criterion: "MSE"
  scheduler: "onecycle"
  epochs: 100
  batch_size: 1536  # perf(2026-07-07): 512->1536 to match the other models and use more of the 12GB GPU. PatchTST is channel-independent (effective batch ~= 1536*27 through the transformer), so it's the most OOM-prone model here; drop to 1024/768 if CUDA OOMs.
  lr: 1e-4
  early_stopping: True
  weight_decay: 1e-4
  num_enc_layers: 3
  d_model: 16
  d_ff: 32
  num_heads: 2
  dropout: 0.3
  ff_dropout: 0.3
  attn_dropout: 0.0
  pred_dropout: 0.0
  # Canonical PatchTST: channel-independent shared head (~44K params). Set False
  # only for a deliberate channel-mixing variant (flatten-across-channels head,
  # ~27M params at 27 channels; do not use as the standard PatchTST baseline).
  channel_independent: True

scheduler:
  pct_start: 0.3
  lradj: "type3"

early_stopping:
  patience: 20

conf:
  conf: True
  alpha: 0.1
  corrected: False
  intervals: True
  validation_eval: False
