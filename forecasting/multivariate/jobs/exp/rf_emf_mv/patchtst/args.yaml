# Multivariate (multi-channel) PatchTST forecasting on the Italy EMF datasets.
# Hyperparameters are copied verbatim from rf_emf/patchtst/args.yaml; only the
# multivariate switches differ (univariate=False, dataset_class=forecasting,
# conf.conf=True, eval_test_per_epoch=False). data.dataset / seq_len / pred_len /
# exp.id are set per run by .personal/scripts/multivariate/conformal-prediction-grid.sh, and
# data.num_channels is auto-inferred from the CSV at load time (27 or 29).
exp:
  project_name: "rf-emf-forecasting/RF-EMF-MV"
  model_id: "PatchTST"
  learning_type: "sl"
  id: ""
  seed_list: [69421, 69422]
  seed: 69421
  mae: True
  rank_verbose: False
  task: "forecasting"
  gpu_id: 0
  neptune: False
  mps: False
  compile: True  # perf: ~1.5-1.7x on attention-heavy models; numerically equivalent to eager
  eval_test_per_epoch: False  # perf(2026-07-06): diagnostic-only test eval; no effect on metrics

data:
  seq_load: True
  dataset: "ED2022"
  univariate: False
  window_stride: 1
  dtype: "float32"
  seq_len: 336
  pred_len: 96
  train_split: 0.7
  val_split: 0.1
  num_channels: 27
  num_workers: 4  # perf: 4 workers measured faster than 0 on 24-core CUDA box
  pin_memory: True  # perf: pinned staging for non_blocking H2D copies on CUDA
  scale: True
  patch_dim: 16
  patch_stride: 8

ddp:
  ddp: False
  master_port: "12356"

sl:
  optimizer: "adam"
  dataset_class: "forecasting"
  criterion: "MSE"
  scheduler: "onecycle"
  epochs: 100
  batch_size: 512
  lr: 1e-4
  early_stopping: True
  weight_decay: 1e-4
  num_enc_layers: 3
  d_model: 16
  d_ff: 32
  num_heads: 2
  dropout: 0.3
  ff_dropout: 0.3
  attn_dropout: 0.0
  pred_dropout: 0.0
  # Canonical PatchTST: channel-independent shared head (~44K params). Set False
  # only for a deliberate channel-mixing variant (flatten-across-channels head,
  # ~27M params at 27 channels; do not use as the standard PatchTST baseline).
  channel_independent: True

scheduler:
  pct_start: 0.3
  lradj: "type3"

early_stopping:
  patience: 20

conf:
  conf: True
  alpha: 0.1
  corrected: False
  intervals: True
  validation_eval: False
