# Multivariate EMForecaster smoke test - the multivariate counterpart of the
# univariate `test` job (forecasting/univariate/jobs/exp/test/args.yaml).
#
# Purpose: verify the whole multivariate pipeline is wired end to end
# (config load -> data-dir resolution -> multi-channel loaders -> EMForecaster
# build -> forward -> loss -> backward -> train/val/test loop) in a few epochs,
# not a full run. Run it with:
#
#     python main.py rf_emf_mv/test --quick     # single seed, fast
#
# The `rf_emf_mv/` prefix is REQUIRED: main.py routes only rf_emf_mv/* jobs to
# forecasting.multivariate; a job named `test` would dispatch to univariate.
#
# It mirrors the univariate smoke test (EMForecaster, 5 epochs, seq_len 20 /
# pred_len 30) but flips the multivariate switches: univariate=False,
# dataset_class=forecasting, and the real multivariate EMForecaster backbone
# (TSMixer patch model + Linear head, channel-independent patching) from
# rf_emf_mv/emforecaster. Conformal prediction is left off (conf defaults to
# False) to keep the smoke test fast, exactly like the univariate `test` job.
#
# EMForecaster is multivariate via channel independence: it folds the C channels
# into the batch, forecasts them jointly in one pass, and returns (B, C, O).
# data.num_channels is auto-inferred from the CSV at load time (27 for ED2022).
# The effective batch through the patch backbone is batch_size * num_channels,
# so batch_size is lowered from the production 512 to keep the run light on CPU/MPS.
exp:
  project_name: "rf-emf-forecasting/RF-EMF-MV"
  model_id: "EMForecaster"
  patch_model_id: "TSMixer"
  backbone_id: "Linear"
  learning_type: "sl"
  id: ""
  seed_list: [69421, 69422, 69423, 69424, 69425]
  seed: 69421
  mae: True
  rank_verbose: False
  task: "forecasting"
  neptune: False
  eval_test_per_epoch: True

data:
  patch_dim: 8
  patch_stride: -1
  seq_load: True
  dataset: "ED2022"
  univariate: False
  window_stride: 1
  dtype: "float32"
  seq_len: 20
  pred_len: 30
  train_split: 0.7
  val_split: 0.1
  num_channels: 27
                   # (avoids the macOS multiprocessing DataLoader-worker crash)
  scale: True

tsmixer:
  dropout: 0.3
  num_enc_layers: 2
  d_model: 256

dlinear:
  moving_avg: 3
  individual: False
  final_moving_avg: 25

ddp:
  ddp: False
  master_port: "11759"
  find_unused_parameters: True

sl:
  optimizer: "adam"
  pos_enc: "none"
  dataset_class: "forecasting"
  criterion: "MSE"
  scheduler: "onecycle"
  dropout: 0.3
  epochs: 5
  batch_size: 64
  lr: 1e-4
  early_stopping: True
  weight_decay: 1e-5
  return_head: True

  # RevIN
  revin: True
  revin_affine: True
  revout: True
  eps_revin: 1e-5

  # EMForecaster
  patch_norm: "none"
  patch_act: "gelu"
  patch_embed_dim: 256
  independent_patching: False

scheduler:
  pct_start: 0.3
  lradj: "type3"

early_stopping:
  patience: 20
