# Univariate (single-series) Transformer baseline on the DET/PTV monitoring CSVs
# (model_id RF_EMF_Transformer, models/rf_emf_baselines.py::Transformer).
#
# d_model MUST be 2: the arch's conv1 (kernel_size=2) collapses the feature dim
# 2 -> 1 before the final Linear(seq_len, pred_len), so any other value reaches
# fc2 with a last dim of d_model - 1 and raises "mat1 and mat2 shapes cannot be
# multiplied". This file carried a stale d_model: 64 that could not run at all --
# every Transformer cell of the univariate_series grid crashed on the first
# forward pass -- until 2026-07-24. 2 is the value the multivariate job already
# documents and the one that produced the published Transformer column.
#
# data.dataset / seq_len / pred_len / exp.id are set per run by
# forecasting/grid.py (python main.py --grid --setup univariate_series).
exp:
  project_name: "rf-emf-forecasting/RF-EMF"
  model_id: "RF_EMF_Transformer"
  learning_type: "sl"
  id: ""
  best_model_path: "checkpoint/rf_emf_baseline"
  seed_list: [69421, 69422]
  seed: 69421
  mae: True
  neptune: False

data:
  seq_load: True
  dataset: "rf_emf_ptv2"
  univariate: True
  window_stride: 1
  dtype: "float32"
  seq_len: 336
  pred_len: 336
  train_split: 0.7
  val_split: 0.1
  num_channels: 1
  scale: True

ddp:
  ddp: False
  master_port: "12356"
  seq_load: False

sl:
  dataset_class: "univariate_forecasting"
  criterion: "MSE"
  d_model: 2
  num_heads: 2
  num_enc_layers: 2
  epochs: 100
  batch_size: 512
  lr: 1e-4
  early_stopping: True
  weight_decay: 1e-4
  scheduler: "onecycle"

scheduler:
  pct_start: 0.3
  lradj: "type3"

early_stopping:
  patience: 20

conf:
  conf: False
  alpha: 0.01
  corrected: False
  intervals: True
  validation_eval: False
