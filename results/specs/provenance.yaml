# Code commits inferred for runs logged BEFORE provenance stamping (2026-09-19).
#
# From 2026-09-19 every run writes parameters/exp/git_commit itself
# (forecasting/provenance.py) and needs nothing from this file. The runs that
# predate it -- all 875 in the live tree on that date -- carry only
# parameters/exp/time, so `make.py extract` assigns them a commit from the
# rules below and marks the row commit_source = "inferred" (a stamped run reads
# "log"; a run no rule covers reads ""). A rule matches on the frames setup
# slug, an optional model list, and a half-open exp/time window [from, to);
# the first match wins. `basis` says why that commit and how sure it is.
#
# What "inferred" can and cannot claim: it is the last commit whose code the
# run could have used, dated from the commit log. Uncommitted edits present at
# run time are invisible to it -- that is exactly the gap stamping closes.
# The reproduction probe of 2026-09-19 (.personal/PLAN.md, Phase 0.5) is the
# empirical check behind the multivariate/per-channel rules.
inferred:
  - setup: multivariate
    from: 2026-08-01
    to: 2026-08-03
    commit: 401ba0a2210a5025439f878484dad153321c8974
    basis: >
      401ba0a2 ("hybrid updates", 2026-08-01 14:38) is the last commit before
      the six 2026-08-01 multivariate cells (15:42-21:50); the next commit is
      e84faec4 on 08-03. DLinear, TSMixer, LSTM, ARIMA and EMForecaster reproduce
      these cells bit-for-bit at HEAD (probe 2026-09-19, .personal/probe_2026-09-19.txt),
      so the training path was equivalent to today's; the Transformer cell trained
      compiled and is not reproducible eagerly.
  - setup: multivariate
    models: [PatchTST]
    from: "2026-08-03 16:11"
    to: "2026-08-03 16:32"
    commit: cbaab8d01d6e3db3909a5804736762f987a9bee3
    basis: >
      cbaab8d0 ("updated the grid to have all models for all setups", 16:11)
      put PatchTST back into MV_MODELS; its three cells ran 16:12-16:17 and were
      committed as c2910b50 at 16:32. The cells trained compiled (hardware
      profile), so they do not reproduce eagerly and are rerun in Phase 2.
  - setup: perchannel
    from: 2026-08-01
    to: 2026-08-03
    commit: 401ba0a2210a5025439f878484dad153321c8974
    basis: >
      Same window and same last commit as the multivariate cells above
      (581 band runs, 2026-08-01 22:08 - 2026-08-02 17:05). Band 0 of five
      models reproduces bit-for-bit at HEAD; the PatchTST and Transformer bands
      trained compiled and differ by 0.05-0.9%.
  - setup: cluster
    from: 2026-08-25
    to: 2026-08-26
    commit: e30d4f082c29732fd31a8d2d12d109c12485ec4c
    basis: >
      e30d4f08 ("added the new results for clustering", 2026-08-25 15:04)
      committed these 105 runs together with the native-CCM code that produced
      them (models/ccm.py, dlinear/tsmixer/patchtst n_clusters path); the runs
      are stamped 14:50-17:32 and forecasting/ is byte-identical between that
      commit and HEAD. Stronger than the date alone: the code and the logs
      landed in one commit.
# The single-series tree (logs/univariate, setup "series") is outside the
# paradigm comparison and is deliberately left without a rule.

# Runs STAMPED on a dirty tree record the commit they sat on, not the code they
# ran, so the extractor treats their code as unknown unless a rule below vouches
# for it. Each rule names the stamped commit (a prefix is enough), a half-open
# [from, to) window on parameters/exp/time, and the commit whose training code
# those runs used, with the evidence beside it. A matching run reads
# commit_source = "attested" in runs.csv; git_commit keeps the stamp.
attested:
  - stamped: 6f6d60d3c2502d84d2ed795e169261b09d0db7d0
    from: "2026-09-20 10:34"
    to: "2026-09-20 15:10"
    code: bc3bc57caab503c05fb7fe86064ee4464d5e9a03
    basis: >
      The 1,114 VoIP runs of 2026-09-20 stamped 6f6d60d3 with a dirty tree
      (10:34:23 - 15:09:37). The dirt was the Phase 1 pipeline, committed as
      bc3bc57c at 15:09:37 while the sweep was still running. Modification
      times under the training paths show both exp.py edits landing at 10:33:19,
      a minute before the first of these runs, and nothing else changing inside
      the window except forecasting/multivariate/README.md (10:42) and
      forecasting/test_voip.py (10:46), neither of which training reads. So
      every run in the window used the training code bc3bc57c records. The 246
      runs after the commit are stamped bc3bc57c on a clean tree and need no
      rule.

# Training-code versions counted as another version. A version is the
# fingerprint of the training paths (frames.code_fingerprint), so ANY edit there
# -- a comment, a new model the grid never reaches, an extra logged key --
# starts a new one, and a sweep trained after it would split every cell it
# joins into two code versions. A rule here says the edit did not change what
# the runs compute: `from` is the new fingerprint, `to` the version its runs
# count as, and `evidence` how that was shown -- a rule without evidence is
# ignored. runs.csv keeps the raw fingerprint in code_version and the version
# it counts as in code_equivalent (cells.csv: code_versions / code_equivalents);
# MANIFEST.json lists every raw version with its equivalent_to, and `make.py
# extract` warns about a split only across versions that are still distinct
# after these rules. Rules chain; fingerprints match exactly. A version mapped
# to two others, or rules that come back to where they started (a -> b with
# b -> a, or a -> a), are misconfigurations: extract warns and ignores those
# rules, so the versions stay distinct.
#
# 2414d9334cd4 (HEAD from 26d30764 to 51af0718e: the only fingerprinted change
# from 21e1374ddc2c is GIT_OPTIONAL_LOCKS=0 in forecasting/provenance.py, which
# stamps metadata only) needs no rule: no run in logs/ was trained there.
# Nor does 854718aed9ae (HEAD from e9e73f6f9: a docstring in
# forecasting/multivariate/models/ccm.py, after the 2026-09-24 sweep ended).
equivalent_code:
  - from: bb6be0a379d9
    to: 21e1374ddc2c
    evidence:
      - >
        What changed. From 21e1374ddc2c (last at 5743b2bf5) to bb6be0a379d9
        (f139f7ecf) the training paths changed by: GIT_OPTIONAL_LOCKS=0 in
        forecasting/provenance.py's git calls (26d30764, fingerprint
