# The solo per-channel timing pass: what a per-channel band costs to train
# when it has the GPU to itself.
#
# Why it exists. The per-channel grid trains a dozen bands at once
# (parameters/exp/concurrency 8 or 12), so a band's logged running_time is a
# contended time: per epoch, 0.9x to 9.1x its solo time across the measured
# bands, and 1.0x to 7.8x on average over a cell's (EMForecaster and the
# Transformer the most). The multivariate and cluster grids train one run at a
# time, so their running_time needs no correction.
#
# What was measured. On 2026-09-22 three bands of every per-channel
# (model, dataset) cell at L336/O96 -- the first, middle and last band -- were
# retrained at seed 69422, one at a time, from an isolated worktree at 8bccefb7
# (training code 21e1374ddc2c, the code of the published runs), with a GPU
# poller confirming no other process was on the card (foreign processes: none
# in all 54). Each solo band is paired with its published seed-69422 twin,
# which trained the same band 12 at a time. 39 of the 54 reproduce their twin
# exactly (same epochs, same sl_test/loss; `reproduced` below); the other 15
# are eight of the nine LSTM bands (at most 1.2e-4 relative in test loss) and
# seven of the nine Transformer bands, two of which (ED2022 ch26, EMF2023
# ch14) stopped at a different epoch. Cost is therefore compared per epoch,
# never per run.
#
# Where it came from. The raw pass lives in .personal/timing/ (results.jsonl,
# the solo run dirs, timing_pass.py and timing_analyze.py), which is
# git-ignored; the table below copies from it, per band, the solo run's
# epochs and parameters/total_training_seconds and its twin's, so the frames
# never read .personal/. The model and dataset spellings are runs.csv's.
#
# How it is used. `make.py extract` writes frames/timing.csv from this block
# and runs.csv (frames.build_timing): for every complete per-channel seed of a
# measured cell, the seed's epochs summed over every band times the cell's solo
# seconds per epoch (sum of seconds over sum of epochs of its measured bands),
# bracketed by its fastest and slowest measured band, next to the logged
# contended sum and the multivariate run of the same seed. Epochs come from the
# live logs, so a band that is retrained (the 16 EMForecaster seed-69421 bands
# of 2026-09-24) moves its seed's estimate with it. There is no VoIP pass: its
# per-epoch per-channel/multivariate ratios (0.61-1.03) show no measurable
# contention (.personal/AUDIT_2026-09-24.md, finding V7).
