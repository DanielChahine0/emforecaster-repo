# Which published values the value gate may find changed, and why: one block
# per family (emf, voip), each written for that family's frozen snapshot.
#
# `make.py tables` and `make.py reconcile` hold every value a family's frozen
# snapshot (SNAPSHOTS in emfres/cli.py) publishes against the value today's
# frames give (emfres/reconcile.py). Three kinds are held:
#
#   cells       the MSE/MAE tables of Multivariate, Univariate Series,
#               Univariate (Per Channel) and Cluster (k-Grouped Channels),
#               recomputed from frames/cells.csv: each from the column its
#               section prints it from today, a cluster cell from its
#               fixed-protocol mean (mse_fixed, mae_fixed);
#               fields: setup, model, dataset, window, k, metric
#   scoreboard  the Paradigm Comparison's scoreboard and sensitivity rows,
#               against today's render;
#               fields: section, table, comparison, variant, metric, column
#   sweep       the Channel Clustering (CCM) vs. plain section: each model's
#               plain cell, its cell at every k, its val k and oracle k,
#               against today's render;
#               fields: dataset, window, metric, model, column, k
#
# A published value that no longer reproduces is a change. A change a rule
# under `expected` matches prints as EXPECTED, under the rule's reason; any
# other is UNEXPECTED and fails the gate. A rule matches on the fields it names
# (a value or a list; case does not matter) plus an optional k_min, and every
# field it omits is a wildcard. `now` pins what the values it matches print
# today, so that the rule forgives the transition its reason declares and not
# any value in its columns: either one printed value, for every value the rule
# matches, or a list of entries, each naming some of the kind's fields and the
# `value` the values those fields pick out print today. A matched value that
# prints anything else is unexpected. A rule with no reason, an unknown kind, a
# field its kind does not have or a malformed `now` is ignored with a warning:
# dropping a rule can only make the gate stricter. No rule forgives a value
# that vanished or turned into '-': a rule declares a value that moved, not
# one that went missing.
# Values today's report has and the snapshot does not -- new models, new rows,
# new columns -- are counted as new and need no rule.
#
# `held_elsewhere` is for a scoreboard row whose quantity today's report prints
# under another name. Each entry names the comparisons, the sensitivity row
# (`variant`) that now carries the snapshot's quantity, the `models` the
# snapshot counted (model ids as in runs.csv) and a reason. The gate re-counts
# today's paradigm comparison over those models alone and holds every value of
# those scoreboard rows against that sensitivity row, where it has to
# reproduce like any other. Under the old name the rows are still held, but
# only for being printed: what today's row prints there is a quantity the
# snapshot never published and counts as new, but a value missing from it, or
# printed '-' where the snapshot printed one, fails the gate, and no rule
# forgives it. An entry missing a field is ignored with a warning, and its rows
# are then held under their own name.
#
# A family's block has three keys: `snapshot`, the file in archive/ its rules
# were written for, and the two lists. Against any other snapshot the lists
# are ignored, so re-freezing is the step that retires them. One family's gate
# never reads another's block, and a list outside a family block is not read
# at all (with a warning): dropping rules can only make the gate stricter.
#
# Freezing a family (once the changes expected against its old snapshot are
# reviewed): render it with `make.py tables --family F`; copy its all.md
# (tables/all.md for emf, tables/voip/all.md for voip) into archive/ as
# <date>_tables.md (emf) or <date>_voip_tables.md (voip); point SNAPSHOTS[F]
# in emfres/cli.py at the copy; and set F's `snapshot` below to the copy's name
# with empty `held_elsewhere` and `expected` lists. `make.py reconcile` gates
# every family that has a snapshot and names each one that has none.

emf:
  # The EMF lists were written for 2026-09-22_tables.md. Re-freeze once they
  # are reviewed and accepted, after the 2026-09-24 CCM sweep ends.
  #
  # The Cluster (k-Grouped Channels) section leads with the fixed protocol since
  # the owner's 2026-09-24 decision; the snapshot's cluster cells are the logged
  # batch protocol (b6e394191). Each is held twice:
  # against today's fixed-protocol mean, where its k >= 2 values moved (the last
  # rule below), and against the batch mean it was published from, whose runs
  # have not changed. A change there is a real one: no rule forgives it, whatever
  # the rule names (reconcile.BATCH_VIA). At k = 1 the two protocols are one
  # forecast, and no k = 1 value is expected to move.

  snapshot: 2026-09-22_tables.md

  held_elsewhere:
    - comparison: [Cluster (k=1) vs Multivariate, Cluster (best k) vs Cluster (k=1),
                   Cluster (best k) vs Multivariate]
      variant: batch protocol (k chosen on the logged `sl_val/loss`)
      models: [DLinear, PatchTST, TSMixer]
      reason: >
        The snapshot's three cluster comparisons are the logged batch protocol
        (k chosen on sl_val/loss) over the three models it clustered. Today's
        scoreboard rows of the same name are the fixed train-mean membership
        protocol (primary since the owner's 2026-09-24 decision), over six models
        as EMForecaster, the Transformer and LSTM complete: a quantity the
        snapshot never published, so their values are new, though each still
        has to be printed. The snapshot's quantity is today's batch-protocol
        sensitivity row, re-counted over DLinear, PatchTST and TSMixer, whose
        cluster runs the sweep does not touch -- so every value of those rows
        has to reproduce there.

  expected:
    - kind: cells
      setup: perchannel
      model: EMForecaster
      window: L336/O96
      now:
        - {dataset: ED2022, metric: MSE, value: "0.4882"}
        - {dataset: ED2022, metric: MAE, value: "0.3441"}
        - {dataset: EMF2023, metric: MSE, value: "1.5060"}
        - {dataset: EMF2023, metric: MAE, value: "0.4499"}
      reason: >
        16 per-channel EMForecaster bands (seed 69421: 8 ED2022, 3 UH2022,
        5 EMF2023) had trained at 512x1 instead of the grid's 128x4. The
        2026-09-24 sweep retrained them at 128x4 and moved the old copies to
        logs/_archive/2026-09-24_pc-emf-512x1/. All 16 have landed: ED2022 moves
        MSE 0.4879 -> 0.4882 and MAE 0.3440 -> 0.3441, EMF2023 MSE 1.5059 ->
        1.5060 and MAE 0.4498 -> 0.4499; UH2022 does not move.

    - kind: scoreboard
      comparison: Per-channel vs Multivariate
      column: [Tie, Cells]
      now:
        - {column: Tie, metric: MAE, value: "7"}
        - {column: Tie, metric: MSE, value: "5"}
        - {column: Cells, value: "18"}
      reason: >
        ARIMA's three cells are identical by construction (one model per band,
        no gradient path) and now sit in the scoreboard's Identical column
        instead of counting as ties (audit 2026-09-24, step 7.2): Tie and Cells
        each drop by 3 (Tie MAE 10 -> 7, MSE 8 -> 5; Cells 21 -> 18), the wins
        and losses do not change.

    - kind: scoreboard
      comparison: Per-channel vs Multivariate
      metric: MSE
      column: Median gap
      now: "+1.04%"
      reason: >
        The median relative gap moves with the retrained per-channel
        EMForecaster bands (the first cells rule): MSE +1.03% -> +1.04%; the
        MAE median does not move. ARIMA was already left out of the median and
        of the test.

    - kind: scoreboard
      comparison: Cluster (k=1) vs Multivariate
      column: Median gap
      now:
        - {metric: MAE, value: "+0.00%"}
        - {metric: MSE, value: "-0.00%"}
      reason: >
        The median gap is now taken over every counted cell (e54f8910b); it
        used to leave out the cells whose two sides differ by less than 5e-05,
        which the Wilcoxon test still does. At k = 1 the cluster module is off,
        so 6 of the 9 MAE cells and 7 of the 9 MSE cells are such cells, and
        the median moves to zero: MAE +0.09% -> +0.00%, MSE +0.01% -> -0.00%.
        Held against the batch-protocol row (held_elsewhere 1); its counts and
        p still reproduce.

    - kind: sweep
      dataset: ED2022
      window: L336/O96
      metric: MAE
      column: k
      k_min: 2
      now:
        - {model: DLinear, k: 2, value: "0.3764 ±0.0001"}
        - {model: DLinear, k: 3, value: "0.3764 ±0.0002"}
        - {model: DLinear, k: 5, value: "0.3766 ±0.0002"}
        - {model: DLinear, k: 9, value: "0.3771 ±0.0006"}
        - {model: PatchTST, k: 2, value: "0.3865 ±0.0151"}
        - {model: PatchTST, k: 3, value: "0.3757 ±0.0141"}
        - {model: PatchTST, k: 5, value: "0.3906 ±0.0124"}
        - {model: PatchTST, k: 9, value: "0.3692 ±0.0025"}
        - {model: TSMixer, k: 2, value: "0.3619 ±0.0021"}
        - {model: TSMixer, k: 3, value: "0.3684 ±0.0176"}
        - {model: TSMixer, k: 5, value: "0.3600 ±0.0039"}
        - {model: TSMixer, k: 9, value: "0.3671 ±0.0099"}
      reason: >
        The sweep now prints the fixed train-mean membership protocol
        (sl_test_fixed/*); the snapshot printed the logged batch protocol, under
        which a k > 1 forecast depends on its neighbouring test windows. At
        k = 1 the two are one forecast, so k = 1 and plain are not expected to
        move. The snapshot's three models take their fixed-protocol values from
        the eval_fixed.json sidecars of runs the sweep does not touch, so each
        k >= 2 value is pinned to the one they give.

    - kind: sweep
      dataset: ED2022
      window: L336/O96
      metric: MAE
      column: oracle k
      now:
        - {model: DLinear, value: "3"}
        - {model: TSMixer, value: "5"}
      reason: >
        The snapshot underlined the k with the best test value, which the sweep
        now prints as the oracle k; it is chosen over the k >= 2 values that
        moved with the protocol, and moves with them: DLinear 2 -> 3, TSMixer
        2 -> 5. PatchTST's stays at 9.

    - kind: cells
      setup: cluster
      window: L336/O96
      k_min: 2
      now:
